services:

  payment-exporter:
    build:
      context: ./exporter

    container_name: payment-exporter

    ports:
      - "9400:9400"

    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:9400/metrics"
        ]
      interval: 30s
      timeout: 10s
      retries: 3


  prometheus:
    image: prom/prometheus:latest

    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/prometheus/rules.yml:/etc/prometheus/rules.yml
      - ./docker/prometheus/slo-rules.yml:/etc/prometheus/slo-rules.yml

    restart: unless-stopped


  alertmanager:
    image: prom/alertmanager:latest

    container_name: alertmanager

    ports:
      - "9093:9093"

    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml

    restart: unless-stopped


  grafana:
    image: grafana/grafana:latest

    container_name: grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana-storage:/var/lib/grafana

      # Dashboard JSON files
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards

      # Dashboard provisioning configuration
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards

      # Datasource provisioning (Prometheus)
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources

    restart: unless-stopped


volumes:

  grafana-storage: